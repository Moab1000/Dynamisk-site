<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="productlist.css" />
  <script src="productlist.js" defer></script>
  <title>Product List</title>
</head>

<body>
  <header>
    <a href="index.html" class="logo"><img src="img/logo.png" alt="FashionRUs logo">Fashion<span>Я</span>Us</a>
    <nav>
      <a href="index.html">Categories</a>
      <a href="productlist.html">All products</a>
      <a href="index.html#seasons">Seasons</a>
    </nav>
  </header>

  <main>
    <h1>All Products</h1>

    <details class="filters">
      <summary class="filter_icon">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M3 4h18l-7 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
        Filter
      </summary>

      <div class="filter_group filter_category">
        <h3>Category</h3>
        <button data-category="All">All</button>
        <button data-category="Accessories">Accessories</button>
        <button data-category="Apparel">Apparel</button>
        <button data-category="Footwear">Footwear</button>
        <button data-category="Free Items">Free Items</button>
        <button data-category="Personal Care">Personal Care</button>
        <button data-category="Sporting Goods">Sporting Goods</button>
      </div>

      <div class="filter_group filter_season">
        <h3>Season</h3>
        <button data-season="All">All</button>
        <button data-season="Spring">Spring</button>
        <button data-season="Summer">Summer</button>
        <button data-season="Fall">Fall</button>
        <button data-season="Winter">Winter</button>
      </div>

      <div class="filter_group filter_who">
        <h3>Who</h3>
        <button data-gender="All">Everyone</button>
        <button data-gender="Women">Women</button>
        <button data-gender="Men">Men</button>
        <button data-gender="Unisex">Unisex</button>
      </div>

      <div class="filter_group filter_deals">
        <h3>Deals</h3>
        <button data-deal="All">All</button>
        <button data-deal="Sale">On sale</button>
        <button data-deal="InStock">In stock</button>
      </div>

      <div class="filter_group filter_price">
        <h3>Price</h3>
        <button data-sort="low">Cheapest first</button>
        <button data-sort="high">Most expensive first</button>
      </div>
    </details>

    <div class="product_list_container"></div>
  </main>
</body>

</html>
